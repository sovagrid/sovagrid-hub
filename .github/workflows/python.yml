name: Hub

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13', '3.15']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: docker build --tag sovagrid-hub:ci .
      - name: Check installed module
        run: docker run --rm --network none --entrypoint python3 sovagrid-hub:ci -c 'import sovagrid_hub.auth, sovagrid_hub.http_api'
